# Content Profile ships no model or provider choice.
# Configure this isolated profile with: hermes -p content-profile model
# Hermes manages supported shared sign-ins separately from model settings.
# Existing config.yaml is preserved on profile update.

memory:
  write_approval: true

mcp_servers:
  beehiiv:
    url: https://mcp.beehiiv.com/mcp
    auth: oauth
    enabled: false
    trust: untrusted
    sampling:
      enabled: false
    elicitation:
      enabled: false
    tools:
      include: []
      prompts: false
      resources: false
